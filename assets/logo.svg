<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Recorta las aspas: huecos exteriores, centro y ranuras. -->
    <mask id="corte">
      <rect width="64" height="64" fill="#fff"/>
      <circle cx="32" cy="16.9" r="11.03" fill="#000"/>
      <circle cx="47.24" cy="43.3" r="11.03" fill="#000"/>
      <circle cx="16.76" cy="43.3" r="11.03" fill="#000"/>
      <circle cx="32" cy="34.5" r="3.5" fill="#000"/>
      <g stroke="#000" stroke-width="1.7">
        <line x1="32" y1="34.5" x2="32" y2="27.2"/>
        <line x1="32" y1="34.5" x2="38.32" y2="38.15"/>
        <line x1="32" y1="34.5" x2="25.68" y2="38.15"/>
      </g>
    </mask>
    <!-- El anillo solo se ve dentro de los huecos, separado de las aspas. -->
    <clipPath id="huecos">
      <circle cx="32" cy="16.9" r="9.6"/>
      <circle cx="47.24" cy="43.3" r="9.6"/>
      <circle cx="16.76" cy="43.3" r="9.6"/>
    </clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0a0d0b"/>
  <g mask="url(#corte)" fill="#9dff3a">
    <circle cx="32" cy="22.95" r="15.75"/>
    <circle cx="42" cy="40.28" r="15.75"/>
    <circle cx="22" cy="40.28" r="15.75"/>
  </g>
  <circle cx="32" cy="34.5" r="12.34" fill="none" stroke="#9dff3a" stroke-width="3.7" clip-path="url(#huecos)"/>
  <circle cx="32" cy="34.5" r="1.9" fill="#ff3b5c"/>
</svg>
